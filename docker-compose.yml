# Ananta Events — local development stack (Django + PostgreSQL)
# Usage from the repo root:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ananta
      POSTGRES_USER: ananta
      POSTGRES_PASSWORD: ananta-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ananta -d ananta"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: docker-dev-secret-key-0123456789abcdef0123456789abcdef
      ALLOWED_HOSTS: "*"
      # "disable" because the compose postgres has no TLS
      DATABASE_URL: postgres://ananta:ananta-dev-password@db:5432/ananta
      DB_SSLMODE: disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SECURE_COOKIES: "False"
      SEED_ON_START: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/backend/staticfiles

volumes:
  pgdata:
  static_volume:
